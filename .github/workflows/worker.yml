name: Sentinel Shield Auto Tasks (8AM–6PM IST)

on:
  schedule:
    # Run every 30 mins between 8 AM–6 PM IST (2:30–12:30 UTC)
    - cron: '0,30 2-12 * * *'
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # -----------------------------
      # Cache node_modules
      # -----------------------------
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      # -----------------------------
      # Cache npm
      # -----------------------------
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-

      # -----------------------------
      # Install dependencies (retry if fails)
      # -----------------------------
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci || npm ci || npm ci  # Retry up to 3 times

      # -----------------------------
      # Run worker
      # -----------------------------
      - name: Run Supabase worker
        run: node worker.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
